<html lang="ar" dir="rtl">

<title>مقاييس اللغة — معجم ابن فارس</title>
<style>
  :root {
    --blue:   #1e3a5f;
    --blue2:  #2d5282;
    --gold:   #b7791f;
    --bg:     #f8f7f4;
    --card:   #ffffff;
    --border: #e2ddd5;
    --text:   #1a1a2e;
    --muted:  #6b6b7a;
    --tag-bg: #eef2f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Arial', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── header ── */
  header {
    background: var(--blue);
    color: #fff;
    padding: 28px 32px 22px;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  header .sub {
    font-size: .95rem;
    color: #a8c0d8;
    font-style: italic;
  }

  /* ── toolbar ── */
  .toolbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .toolbar input, .toolbar select {
    font-family: inherit;
    font-size: .92rem;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    direction: rtl;
  }
  .toolbar input { width: 220px; }
  .toolbar input:focus, .toolbar select:focus {
    border-color: var(--blue2);
    box-shadow: 0 0 0 2px rgba(45,82,130,.15);
  }
  .count-badge {
    margin-right: auto;
    font-size: .85rem;
    color: var(--muted);
    background: var(--tag-bg);
    padding: 4px 10px;
    border-radius: 20px;
    direction: ltr;
  }

  /* ── grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
    padding: 20px 24px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 14px;
    cursor: default;
    transition: box-shadow .15s, transform .1s;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
    transform: translateY(-1px);
  }
  .card-root {
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: .04em;
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .card-bab {
    font-size: .82rem;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .card-heading {
    font-size: .84rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 12px;
    border-top: 1px solid var(--border);
    padding-top: 9px;
    word-break: break-word;
  }
  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    font-size: .74rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    direction: ltr;
  }
  .tag-SINGULAR    { background: #d1fae5; color: #065f46; }
  .tag-DUAL        { background: #dbeafe; color: #1e3a8a; }
  .tag-TRIPLE      { background: #ede9fe; color: #4c1d95; }
  .tag-MULTIPLE    { background: #fef3c7; color: #78350f; }
  .tag-SOUND_ROOTS { background: #e0f2fe; color: #075985; }
  .tag-NONE        { background: #f3f4f6; color: #6b7280; }
  .tag-review      { background: #fef9c3; color: #854d0e; }
  .tag-ok          { background: #dcfce7; color: #166534; }

  /* ── empty ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-size: 1.1rem;
  }
</style>
</head>

 "heading": "( وذم ) الواو والذال والميم : كلةٌ تدك على تعليق شئ بشىء . منهُ", "review": "AUTO_AGREED"}, {"id": "06.pdf:p99:r004", "root": "و", "bab": "", "type": "NONE", "count": null, "heading": "[ و ] وَذِمت الدَّلوُ : انقطَعَ وَذَمُها . أمَّا وذائمُ الأموال فهى التى نُذِرَت فيها", "review": "REVIEW_REQUIRED"}, {"id": "06.pdf:p99:r005", "root": "وذح", "bab": "الواو", "type": "NONE", "count": null, "heading": "( وذح ) الواو والذال والحاء كلمة . فالوَذَح : ما تعلّقَ بأصواف القَم.", "review": "REVIEW_REQUIRED"}, {"id": "06.pdf:p9:r001", "root": "هز", "bab": "الهاء", "type": "NONE", "count": null, "heading": "( هز ) الهاء والزاء : أصلٌ يد على اضطرابٍ فى شىء وحركة ..", "review": "REVIEW_REQUIRED"}, {"id": "06.pdf:p9:r002", "root": "هس", "bab": "الهاء", "type": "SINGULAR", "count": null, "heading": "( هس ) الهاء والسين : أصَيلٌ يدلُ على أصواتٍ واختلاط ،", "review": "AUTO_AGREED"}, {"id": "06.pdf:p9:r003", "root": "هش", "bab": "الهاء", "type": "SINGULAR", "count": null, "heading": "(هش ) الهاء والشين : أصلٌ سحيحٌ يدلُ على رَخاوة ولِين . والرَّخْو", "review": "AUTO_AGREED"}];

const TYPE_AR = {
  SINGULAR:    'أصل واحد',
  DUAL:        'أصلان',
  TRIPLE:      'ثلاثة أصول',
  MULTIPLE:    'أصول متعددة',
  SOUND_ROOTS: 'أصول صحيحة',
  NONE:        'غير محدد',
};

function render() {
  const q      = document.getElementById('q').value.trim();
  const bab    = document.getElementById('bab').value;
  const type   = document.getElementById('type').value;
  const review = document.getElementById('review').value;

  const matches = ENTRIES.filter(e => {
    if (q      && !e.root.includes(q) && !e.heading.includes(q)) return false;
    if (bab    && e.bab !== bab)    return false;
    if (type   && e.type !== type)  return false;
    if (review && e.review !== review) return false;
    return true;
  });

  document.getElementById('cnt').textContent = matches.length.toLocaleString('ar-SA') + ' جذر';

  const grid = document.getElementById('grid');
  if (!matches.length) {
    grid.innerHTML = '<div class="empty">لا توجد نتائج</div>';
    return;
  }

  // Render up to 500 cards at once
  const slice = matches.slice(0, 500);
  grid.innerHTML = slice.map(e => {
    const typeLabel  = TYPE_AR[e.type] || e.type;
    const countLabel = e.count !== null ? ` (${e.count})` : '';
    const babHtml    = e.bab ? `<div class="card-bab">باب ${e.bab}</div>` : '';
    const reviewTag  = e.review === 'REVIEW_REQUIRED'
      ? '<span class="tag tag-review">يحتاج مراجعة</span>'
      : '<span class="tag tag-ok">مؤكد</span>';
    return `<div class="card">
      <div class="card-root">${e.root}</div>
      ${babHtml}
      <div class="card-heading">${e.heading}</div>
      <div class="tags">
        <span class="tag tag-${e.type}">${typeLabel}${countLabel}</span>
        ${reviewTag}
      </div>
    </div>`;
  }).join('');

  if (matches.length > 500) {
    grid.innerHTML += `<div class="empty" style="padding:20px">... و ${(matches.length-500).toLocaleString('ar-SA')} جذر آخر — ضيّق البحث لرؤية المزيد</div>`;
  }
}

render();
</script>
